<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — AI Farmer Helpline</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1b5e20 0%, #2e7d32 50%, #388e3c 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
            padding: 40px 36px;
            width: 100%;
            max-width: 380px;
        }

        .card h1 {
            font-size: 22px;
            color: #1b5e20;
            text-align: center;
            margin-bottom: 6px;
        }

        .card .subtitle {
            font-size: 13px;
            color: #777;
            text-align: center;
            margin-bottom: 28px;
        }

        .error-box {
            background: #ffebee;
            border: 1px solid #ef9a9a;
            color: #c62828;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 14px;
            margin-bottom: 20px;
            role: alert;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #2e7d32;
            box-shadow: 0 0 0 3px rgba(46,125,50,0.15);
        }

        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }

        button[type="submit"]:hover { background: #1b5e20; }
        button[type="submit"]:focus {
            outline: 3px solid #81c784;
            outline-offset: 2px;
        }
    </style>
</head>
<body>
<main>
    <div class="card" role="main">
        <h1>🌾 Admin Login</h1>
        <p class="subtitle">AI Farmer Helpline — Management Console</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="error-box" role="alert" aria-live="assertive">
                    {% for msg in messages %}
                        {{ msg }}
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('admin_login') }}" novalidate>
            {# CSRF token — provided by Flask-WTF when available #}
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() if csrf_token is defined else '' }}">

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    autocomplete="username"
                    required
                    aria-required="true"
                    aria-label="Admin username"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    required
                    aria-required="true"
                    aria-label="Admin password"
                >
            </div>

            <button type="submit">Sign In</button>
        </form>
    </div>
</main>
</body>
</html>
